name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          echo "$STORAGE_CREDENTIALS" > sa-key.json
          echo "$STORAGE_CREDENTIALS" > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT
      - name: Upload model & report to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage
          client = storage.Client()
          bucket = client.bucket(os.environ["ARTIFACT_BUCKET"])
          blob_model = bucket.blob("artifacts/current/model.joblib")
          blob_model.upload_from_filename("models/model.joblib")
          blob_report = bucket.blob("artifacts/current/report.json")
          blob_report.upload_from_filename("outputs/report.json")
          print("Uploaded model.joblib and report.json successfully")
          PYEOF
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          echo "$STORAGE_CREDENTIALS" > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
      - name: Check quality gate & rollback comparison
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import json, os
          from google.cloud import storage

          f1 = float("${{ needs.train.outputs.f1 }}")
          print("=== Quality Gate Check ===")
          print(f"New Model F1 Score: {f1:.4f}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print("Quality gate passed: f1_score >= 0.65.")

          # Bonus 4: So sanh voi mo hinh dang chay tren Cloud Storage
          bucket_name = os.environ.get("ARTIFACT_BUCKET")
          if bucket_name:
              try:
                  client = storage.Client()
                  bucket = client.bucket(bucket_name)
                  blob = bucket.blob("artifacts/current/report.json")
                  if blob.exists():
                      prev_data = json.loads(blob.download_as_text())
                      prev_f1 = float(prev_data.get("f1_score", 0.0))
                      print(f"\n=== Bonus 4: Rollback Safety Check ===")
                      print(f"Current Running Model F1: {prev_f1:.4f}")
                      print(f"New Trained Model F1    : {f1:.4f}")
                      if f1 < prev_f1:
                          raise SystemExit(
                              f"ROLLBACK TRIGGERED: Model moi co F1 ({f1:.4f}) thap hon model cu ({prev_f1:.4f}). "
                              f"Huy release de bao ve he thong production!"
                          )
                      print("Rollback check PASSED: Model moi co F1 >= model cu. Du dieu kien Release!")
                  else:
                      print("Chua co report.json cua model cu tren storage. Bo qua rollback check.")
              except SystemExit:
                  raise
              except Exception as e:
                  print(f"Luu y kiem tra rollback: {e}. Tiep tuc release.")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1